<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundMap</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <div class="app-container">

        <!-- Left column: variable width -->
        <div class="column column-left">
            <div class="content-area" id="image-viewer-container">
                <div id="image-viewer">
                    <img id="preview" data-i18n-alt="viewer.previewAlt" class="hidden" />
                    <canvas id="pixel-overlay"></canvas>
                    <p class="viewer-empty" id="viewer-empty" data-i18n="viewer.noImage"></p>
                </div>

                <div id="controls">
                    <div class="controls-row">
                        <button id="load-btn" data-i18n="controls.load"></button>
                        <button id="reset-btn" class="secondary" data-i18n="controls.reset"></button>
                        <label class="checkbox">
                            <input type="checkbox" id="show-original" />
                            <span data-i18n="controls.showOriginal"></span>
                        </label>
                        <div id="language-switcher"></div>
                    </div>

                    <div class="controls-grid">
                        <label>
                            <span><span data-i18n="controls.columns"></span> <em id="grid-width-value">-</em></span>
                            <input type="range" id="grid-width" min="0" max="1000" value="1000" />
                        </label>

                        <label>
                            <span><span data-i18n="controls.contrast"></span> <em id="contrast-value">0</em></span>
                            <input type="range" id="contrast" min="-100" max="100" value="0" step="1" />
                        </label>

                        <label>
                            <span><span data-i18n="controls.brightness"></span> <em id="brightness-value">0</em></span>
                            <input type="range" id="brightness" min="-100" max="100" value="0" step="1" />
                        </label>

                        <label class="checkbox">
                            <input type="checkbox" id="grayscale" />
                            <span data-i18n="controls.grayscale"></span>
                        </label>

                        <label>
                            <span><span data-i18n="controls.posterize"></span> <em id="posterize-value">off</em></span>
                            <input type="range" id="posterize" min="1" max="32" value="1" step="1" />
                        </label>
                    </div>

                    <p id="dimensions-info" class="info"></p>
                </div>
            </div>
            <div class="footer-area" id="metronome">
                <h3 data-i18n="metronome.title"></h3>
                <div class="metronome-controls">
                    <div class="metronome-bpm">
                        <label for="bpm-input" data-i18n="metronome.tempo"></label>
                        <div class="bpm-input-group">
                            <button id="bpm-minus10" class="bpm-step" title="-10 BPM">-10</button>
                            <button id="bpm-minus1"  class="bpm-step" title="-1 BPM">-1</button>
                            <input type="number" id="bpm-input" min="20" max="300" value="120" />
                            <button id="bpm-plus1"   class="bpm-step" title="+1 BPM">+1</button>
                            <button id="bpm-plus10"  class="bpm-step" title="+10 BPM">+10</button>
                        </div>
                    </div>

                    <div id="metronome-led" class="led"></div>
                </div>
            </div>
        </div>

        <!-- Right column: fixed width -->
        <div class="column column-right">
            <div class="content-area" id="synth-list">
                <div class="synth-list-header">
                    <h2 data-i18n="synthList.title"></h2>
                    <div class="synth-list-header-actions">
                        <button id="play-all-btn" data-i18n-title="synthList.playAllStart">▶</button>
                        <button id="add-synth-btn" data-i18n-title="synthList.add">+</button>
                    </div>
                </div>
                <div class="synth-list-body">
                    <!-- Synthesizers will be dynamically added here -->
                    <p class="placeholder-text" data-i18n="synthList.empty"></p>
                </div>
            </div>
            <div class="footer-area" id="common-controls">
                <h3 data-i18n="synthList.commonControlsTitle"></h3>
                <p data-i18n="synthList.commonControlsText"></p>
            </div>
        </div>

    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
