<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundMap</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <div class="app-container">

        <!-- Colonne gauche : largeur variable -->
        <div class="column column-left">
            <div class="content-area" id="image-viewer-container">
                <div id="image-viewer">
                    <img id="preview" alt="Aperçu de l'image" class="hidden" />
                    <canvas id="pixel-overlay"></canvas>
                    <p class="viewer-empty" id="viewer-empty">Aucune image chargée</p>
                </div>

                <div id="controls">
                    <div class="controls-row">
                        <button id="load-btn">Charger une image</button>
                        <button id="reset-btn" class="secondary">Réinitialiser</button>
                        <label class="checkbox">
                            <input type="checkbox" id="show-original" />
                            Voir l'original
                        </label>
                    </div>

                    <div class="controls-grid">
                        <label>
                            <span>Colonnes <em id="grid-width-value">-</em></span>
                            <input type="range" id="grid-width" min="0" max="1000" value="1000" />
                        </label>

                        <label>
                            <span>Contraste <em id="contrast-value">0</em></span>
                            <input type="range" id="contrast" min="-100" max="100" value="0" step="1" />
                        </label>

                        <label>
                            <span>Luminosité <em id="brightness-value">0</em></span>
                            <input type="range" id="brightness" min="-100" max="100" value="0" step="1" />
                        </label>

                        <label class="checkbox">
                            <input type="checkbox" id="grayscale" />
                            Niveaux de gris
                        </label>

                        <label>
                            <span>Postérisation <em id="posterize-value">off</em></span>
                            <input type="range" id="posterize" min="1" max="32" value="1" step="1" />
                        </label>
                    </div>

                    <p id="dimensions-info" class="info"></p>
                </div>
            </div>
            <div class="footer-area" id="metronome">
                <h3>Métronome</h3>
                <div class="metronome-controls">
                    <button id="metronome-toggle">▶ Démarrer</button>

                    <div class="metronome-bpm">
                        <label for="bpm-input">Tempo (BPM)</label>
                        <div class="bpm-input-group">
                            <button id="bpm-minus10" class="bpm-step" title="-10 BPM">-10</button>
                            <button id="bpm-minus1"  class="bpm-step" title="-1 BPM">-1</button>
                            <input type="number" id="bpm-input" min="20" max="300" value="120" />
                            <button id="bpm-plus1"   class="bpm-step" title="+1 BPM">+1</button>
                            <button id="bpm-plus10"  class="bpm-step" title="+10 BPM">+10</button>
                        </div>
                    </div>

                    <div id="metronome-led" class="led"></div>
                </div>
            </div>
        </div>

        <!-- Colonne droite : largeur fixe -->
        <div class="column column-right">
            <div class="content-area" id="synth-list">
                <div class="synth-list-header">
                    <h2>Synthétiseurs</h2>
                    <button id="add-synth-btn" title="Ajouter un synthétiseur">+</button>
                </div>
                <div class="synth-list-body">
                    <!-- Les synthétiseurs seront ajoutés dynamiquement ici -->
                    <p class="placeholder-text">Aucun synthétiseur pour l'instant.</p>
                </div>
            </div>
            <div class="footer-area" id="common-controls">
                <h3>Commandes communes</h3>
                <p>Paramètres globaux appliqués à tous les synthétiseurs.</p>
            </div>
        </div>

    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
